[project]
name = "audiobook-worker"
version = "0.1.0"
description = "Background jobs: book ingestion (later: embeddings, scene analysis, pre-rendering, deletions)"
requires-python = ">=3.13"
dependencies = [
    "story-core",
    "pydantic-settings==2.15.0",
    "asyncpg==0.31.0",
    "sentry-sdk==2.69.1",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "aiosqlite==0.22.1"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["worker*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.13"
strict = true
# Editable installs use import hooks mypy cannot follow; point at the shared package source.
mypy_path = "../../packages/story-core"

[[tool.mypy.overrides]]
# taskiq decorators are untyped
module = ["worker.*"]
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "botocore", "botocore.*"]
ignore_missing_imports = true
