[project]
name = "audiobook-api"
version = "0.1.0"
description = "Control-plane REST API for the AI interactive audiobook platform"
requires-python = ">=3.13"
dependencies = [
    # Shared domain package (packages/story-core), installed from the repository.
    "story-core",
    "fastapi==0.141.1",
    "python-multipart==0.0.32",
    "uvicorn[standard]==0.53.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "email-validator==2.3.0",
    "sqlalchemy[asyncio]==2.0.53",
    "asyncpg==0.31.0",
    "alembic==1.20.0",
    "redis==8.1.0",
    "pyjwt[crypto]==2.14.0",
    "argon2-cffi==25.1.0",
    "sentry-sdk==2.69.1",
    # LiveKit access tokens for Talk mode (server-side only; keys never leave the API).
    "livekit-api==1.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "httpx==0.28.1",
    "aiosqlite==0.22.1",
    "fakeredis==2.38.0",
    "hypothesis==6.168.0",
    "types-defusedxml==0.7.0.20260504",
    "ruff==0.16.7",
    "mypy==2.3.1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = ["B008"]  # FastAPI Depends() in defaults

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
# Editable installs use import hooks mypy cannot follow; point at the shared package source.
mypy_path = "../../packages/story-core"
plugins = ["pydantic.mypy"]
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "botocore", "botocore.*"]
ignore_missing_imports = true
