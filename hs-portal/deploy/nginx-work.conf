# 우리업무 (workwoori.ggm.kr)
#
# /etc/nginx/sites-available/work 로 저장하고 sites-enabled 에 링크를 건다.
#   ln -s /etc/nginx/sites-available/work /etc/nginx/sites-enabled/work
#   nginx -t && systemctl reload nginx
#
# 그다음 인증서를 받는다(80 으로 먼저 뜬 뒤에 해야 한다):
#   certbot --nginx -d workwoori.ggm.kr
# certbot 이 이 파일에 443 블록과 리다이렉트를 알아서 넣어 준다.
#
# **DNS 를 먼저 맞춰야 한다.** workwoori.ggm.kr 의 A 레코드가 이 서버 IP 를
# 가리키고 있어야 certbot 이 소유 확인을 통과한다.

server {
    listen 80;
    server_name workwoori.ggm.kr;

    # 사이트별 로그. 감시 도구가 이 파일 이름으로 사이트를 가른다.
    # (지금은 감시 대상 목록에 안 넣어 뒀다. 보고 싶으면 .env 의
    #  MONITOR_NGINX_LOGS 에 이 경로를 한 줄 더한다.)
    access_log /var/log/nginx/work.access.log;

    # 업무 지시·요청 본문이 길어질 수 있다.
    client_max_body_size 8m;

    # API 는 **우리업무 전용 프로세스**(work-backend.service)가 받는다.
    # 우리동네 직업계고(8000)와는 프로세스부터 다르다 — 이쪽을 재시작해도
    # 그쪽은 아무 영향이 없다.
    location /api/ {
        proxy_pass http://127.0.0.1:8300;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    root /root/hs-portal/frontend-work;
    index index.html;

    # 빌드 도구를 안 쓰는 정적 파일이라, 고치면 바로 반영돼야 한다.
    # 캐시를 길게 잡으면 배포하고도 예전 화면이 남는다.
    location ~* \.(js|css)$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 사내 도구다. 검색엔진에 걸릴 이유가 없다.
    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    gzip on;
    gzip_types text/css application/javascript application/json;
    gzip_min_length 1024;
}
