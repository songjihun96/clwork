# /etc/nginx/sites-available/diary
# 일지·자기소개서 서비스(diary.ggm.kr).
# 백엔드와 DB는 본 사이트(udjschool.ggm.kr)와 같은 것을 쓴다.
#
# 적용 순서
#   1) DNS 에 diary.ggm.kr A 레코드 -> 49.50.133.46 추가
#   2) 이 파일을 /etc/nginx/sites-available/diary 로 복사
#   3) sudo ln -s /etc/nginx/sites-available/diary /etc/nginx/sites-enabled/
#   4) sudo certbot --nginx -d diary.ggm.kr      (인증서 발급 + https 자동 설정)
#   5) sudo nginx -t && sudo systemctl reload nginx
#
# backend/.env 에 아래 두 줄이 있어야 한다.
#   ALLOWED_ORIGINS=https://udjschool.ggm.kr,https://diary.ggm.kr

server {
    listen 80;
    server_name diary.ggm.kr;

    # certbot 이 https 리다이렉트를 추가한다.
    client_max_body_size 12m;

    # API 는 기록해 전용 백엔드(8100)로 넘긴다. UDJ(8000)와 다른 프로세스다.
    location /api/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 조회수 집계·감사 로그가 실제 접속 IP 를 보도록 넘겨준다.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 업로드된 이미지 등 정적 파일도 백엔드가 서빙한다.
    location /uploads/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
    }

    root /root/hs-portal/frontend-journal/dist;
    index index.html;

    # 해시가 붙은 번들은 오래 캐시해도 안전하다.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA 라우팅: 없는 경로는 index.html 로 넘긴다.
    # /payment/result 같은 결제 콜백 주소가 새로고침돼도 열려야 한다.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 은 매번 새로 확인하게 한다. 배포할 때마다 번들 이름(해시)이
    # 바뀌는데, 브라우저가 예전 index.html 을 쥐고 있으면 예전 화면이 계속
    # 나온다(2026-09-28 "저장 후 홈 이동 미반영"이 이것이었다).
    # 위 try_files 가 /index.html 로 넘긴 요청도 이 블록을 탄다.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
