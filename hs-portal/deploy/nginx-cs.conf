# Connection 헤더는 요청이 WebSocket 일 때만 "upgrade" 여야 한다.
# 늘 "upgrade" 로 박아두면 일반 HTTP 요청의 연결 재사용이 깨진다.
# (이미 다른 파일에 같은 map 이 있다면 중복 정의가 되므로 이 블록은 지운다.)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ⚠️ 이 파일을 서버에 그대로 덮어쓰지 마세요 ⚠️
#
# 서버에 설치된 /etc/nginx/sites-available/udjcs 는 certbot 이 HTTPS 블록
# (listen 443, 인증서 경로, http→https 리다이렉트)을 추가해 둔 상태입니다.
# 이 파일로 덮어쓰면 그 블록이 통째로 사라지고, https://udjcs.ggm.kr 이
# 엉뚱한 사이트(443 기본 서버)로 넘어갑니다. 실제로 한 번 겪었습니다.
#
# 설정을 바꿔야 할 때는 둘 중 하나로 하세요.
#
#   가) 서버 파일을 직접 편집해 바뀐 부분만 옮겨 넣는다 (권장)
#        sudo nano /etc/nginx/sites-available/udjcs
#
#   나) 덮어쓴 뒤 반드시 certbot 으로 HTTPS 를 다시 붙인다
#        sudo cp .../nginx-cs.conf /etc/nginx/sites-available/udjcs
#        sudo certbot --nginx -d udjcs.ggm.kr      # ← 이 줄을 빼면 사이트가 끊깁니다
#        sudo nginx -t && sudo systemctl reload nginx
#
#   확인:  grep -c "listen 443" /etc/nginx/sites-available/udjcs   → 1 이상
#
# /etc/nginx/sites-available/udjcs
# 상담 지원 사이트(udjcs.ggm.kr).
# 백엔드와 DB는 본 사이트(udjschool.ggm.kr)와 같은 것을 쓴다. API 는 /api/cs/ 아래만 부른다.
#
# 적용 순서
#   1) DNS 에 udjcs.ggm.kr A 레코드 -> 49.50.133.46 추가
#   2) 이 파일을 /etc/nginx/sites-available/udjcs 로 복사
#   3) sudo ln -s /etc/nginx/sites-available/udjcs /etc/nginx/sites-enabled/
#   4) sudo certbot --nginx -d udjcs.ggm.kr      (인증서 발급 + https 자동 설정)
#   5) sudo nginx -t && sudo systemctl reload nginx
#
# backend/.env 의 ALLOWED_ORIGINS 에 이 주소를 반드시 넣어야 한다.
#   ALLOWED_ORIGINS=https://udjschool.ggm.kr,https://diary.ggm.kr,https://udjcs.ggm.kr

server {
    listen 80;
    server_name udjcs.ggm.kr;

    # certbot 이 https 리다이렉트를 추가한다.
    client_max_body_size 8m;

    # 내부 업무용이므로 검색엔진이 훑고 가면 안 된다.
    # 화면의 meta 태그만으로는 부족해서 헤더로도 못 박는다.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    # 상담 화면을 다른 사이트가 프레임에 넣어 흉내내는 것을 막는다.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    # API 는 본 사이트와 같은 백엔드(8000)로 넘긴다.
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 사무실 IP 판정과 감사 로그가 실제 접속 IP 를 보도록 넘겨준다.
        # 이 줄이 없으면 모든 접속이 127.0.0.1 로 보여 IP 제한이 무력해진다.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 전화 알림용 WebSocket(/api/cs/ws/calls)이 지나는 길.
        # 이 두 줄이 없으면 연결이 조용히 400 으로 끊기고, 상담원 화면에
        # 전화가 뜨지 않는다. 실패해도 화면은 멀쩡해 보여서 알아채기 어렵다.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # WebSocket 은 조용한 시간이 길다. 60초로 두면 상담원이 대기하는
        # 동안 끊어졌다 붙기를 되풀이한다.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── 통화 음성 중계 ──────────────────────────────────────
    # 이 두 경로만 워커 1개짜리 udt-audio(8010)로 보낸다.
    # 전화망 쪽과 상담원 쪽 WebSocket 이 같은 프로세스에 있어야 소리가
    # 이어진다. 본 백엔드(워커 3개)로 보내면 통화가 무음이 된다.
    #
    # stream 모드를 쓰지 않는다면 이 두 블록은 없어도 된다.
    location /api/cs/ws/audio {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # 통화가 길어져도 끊기지 않게. 통화 중에 끊기면 소리가 멎는다.
        proxy_read_timeout 7200s;
        proxy_send_timeout 7200s;
        # 음성은 모아뒀다 보내면 늦는다. 오는 대로 흘려보낸다.
        proxy_buffering off;
    }

    location /api/cs/phone/voice/stream/ {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 7200s;
        proxy_send_timeout 7200s;
        proxy_buffering off;
    }

    root /root/hs-portal/frontend-cs/dist;
    index index.html;

    # 해시가 붙은 번들은 오래 캐시해도 안전하다.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA 라우팅: 없는 경로는 index.html 로 넘긴다.
    location / {
        # index.html 은 캐시하지 않는다.
        # 해시가 붙은 /assets/ 와 달리 이 파일은 이름이 늘 같아서, 한 번
        # 캐시되면 배포를 해도 브라우저가 옛 화면을 계속 띄운다. 설정이
        # 잠깐 어긋난 사이에 다른 사이트 화면이 캐시되면 그것이 굳어버린다.
        # 실제로 겪었다.
        add_header Cache-Control "no-store, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
