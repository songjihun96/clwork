# /etc/nginx/sites-available/udt
# 프론트(정적 파일)와 백엔드(/api)를 같은 도메인에 묶는 리버스 프록시.
# 이렇게 하면 CORS 문제가 없고 프론트 코드도 안 바꿔도 된다.

server {
    listen 80;
    server_name 내도메인.kr www.내도메인.kr;   # <-- 실제 도메인으로 바꾸세요

    # ---- 업로드 크기·시간 ----
    # 영상(롱폼)이 제일 크다. 백엔드의 MAX_VIDEO_MB 와 **반드시 짝을 맞춰야**
    # 한다. 여기가 작으면 요청이 애플리케이션에 닿기도 전에 413 으로 잘려,
    # 관리자 화면에는 원인을 알 수 없는 실패로 보인다.
    client_max_body_size 6g;      # 백엔드 기본 한도 5GB + 여유

    # 기가 단위 업로드는 몇십 분이 걸린다. 기본 60초 그대로 두면 멀쩡히
    # 올라가던 전송이 중간에 끊긴다.
    client_body_timeout 30m;
    proxy_read_timeout 30m;
    proxy_send_timeout 30m;

    # 본문을 nginx 가 통째로 임시파일에 받아 두었다가 넘기지 않고, 받는 대로
    # 흘려보낸다. 백엔드가 이미 1MB 씩 끊어 디스크에 쓰고 있어서, 버퍼링을
    # 켜 두면 같은 파일을 디스크에 두 번(임시+최종) 쓰게 된다 —
    # 5GB 영상 하나에 10GB 가 필요해진다.
    proxy_request_buffering off;

    # ---- 텍스트 압축 ----
    # JS/CSS 를 gzip 으로 보내 전송량을 1/3 로 줄인다.
    # (예: 217KB 자바스크립트 -> 약 70KB)
    gzip on;
    gzip_vary on;                # 캐시 서버가 압축본/원본을 구분하도록
    gzip_comp_level 6;           # 5~6이 속도·용량 균형점
    gzip_min_length 1024;        # 1KB 미만은 압축해도 이득이 없다
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;
    # 이미지(jpg/png/webp)는 이미 압축돼 있어 대상에서 뺀다.

    # 1) API 요청은 백엔드(gunicorn)로 넘긴다
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 1-2) sitemap.xml 은 백엔드가 학교 목록으로 동적 생성 (검색엔진용)
    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:8000/api/sitemap.xml;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2) 그 외 모든 요청은 프론트 정적 파일(SPA)
    root /root/hs-portal/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;   # React Router 새로고침 대응
    }

    # index.html 은 매번 새로 확인하게 한다. 배포할 때마다 번들 이름(해시)이
    # 바뀌는데, 브라우저가 예전 index.html 을 쥐고 있으면 예전 화면이 계속 나온다.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # 정적 자원 캐시
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
