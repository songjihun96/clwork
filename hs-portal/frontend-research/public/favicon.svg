<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- 패밀리 사이트와 같은 모양(둥근 사각형 + 흰 글자)에 브랜드 주황을 썼다.
       ㅇㅈ 과 나란히 놓아도 한 식구로 보이게 하기 위해서다.

       글자는 글꼴에 기대지 않고 도형으로 박아 두었다. 한글 글꼴이 없는
       기기에서 네모로 깨지는 것을 막는다.

       탭에 보이는 크기는 16px 이다. 두 글자는 그 크기에서 뭉개져
       한 글자만 크게 넣었다. -->
  <rect width="64" height="64" rx="14" fill="#f26522"/>
  <path d="M679 838V-88H812V838ZM93 742V636H402C382 431 279 286 43 173L113 68C442 227 537 458 537 742Z" transform="translate(13.60 45) scale(0.04000 -0.04000)" fill="#ffffff"/>
  <!-- 일지를 적는 서비스라 밑줄을 하나 깔아 공책 느낌을 준다. -->
  <rect x="15" y="50" width="34" height="3.4" rx="1.7" fill="#ffffff" opacity="0.5"/>
</svg>
